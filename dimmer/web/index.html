<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adaptive Screen Dimmer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app" id="app" hidden>
  <header class="top">
    <div class="brand">
      <h1>Screen Dimmer</h1>
      <p class="status" id="status"><span class="dot"></span><span id="status-text" data-t="starting"></span></p>
    </div>
    <label class="power" data-t-title="shortcut_title">
      <input type="checkbox" id="running" role="switch">
      <span class="power-track"><span class="power-thumb"></span></span>
      <span class="power-label" id="running-label"></span>
    </label>
  </header>

  <section class="block">
    <div class="block-head">
      <h2 data-t="displays"></h2>
      <button class="btn subtle" id="identify" type="button" data-t="show_numbers"></button>
    </div>
    <div id="monitors" class="monitors"></div>
  </section>

  <section class="block">
    <div class="block-head">
      <h2 data-t="dim"></h2>
      <button class="btn subtle" data-reset="dim" type="button" data-t="reset"></button>
    </div>
    <div class="group">
      <div class="row">
        <div class="row-label"><span data-t="start"></span><small data-t="start_hint"></small></div>
        <div class="row-ctl slider"><input type="range" id="start" min="0" max="250"><output id="start-out"></output></div>
      </div>
      <div class="row">
        <div class="row-label"><span data-t="full"></span></div>
        <div class="row-ctl slider"><input type="range" id="full" min="1" max="255"><output id="full-out"></output></div>
      </div>
      <div class="row">
        <div class="row-label"><span data-t="max"></span></div>
        <div class="row-ctl slider"><input type="range" id="max" min="0" max="94"><output id="max-out"></output></div>
      </div>
      <div class="row">
        <div class="row-label"><span data-t="attack"></span></div>
        <div class="row-ctl"><div class="seg" id="attack"></div></div>
      </div>
      <div class="row">
        <div class="row-label"><span data-t="release"></span></div>
        <div class="row-ctl"><div class="seg" id="release"></div></div>
      </div>
    </div>
  </section>

  <section class="block">
    <div class="block-head">
      <h2 data-t="glare"></h2>
      <button class="btn subtle" data-reset="glare" type="button" data-t="reset"></button>
    </div>
    <div class="group">
      <div class="row">
        <div class="row-label"><span data-t="mode"></span><small data-t="mode_hint"></small></div>
        <div class="row-ctl"><div class="seg" id="glare"></div></div>
      </div>
      <div class="local" id="glare-local">
        <div class="row">
          <div class="row-label"><span data-t="sensitivity"></span><small data-t="sensitivity_hint"></small></div>
          <div class="row-ctl slider"><input type="range" id="glare_contrast" min="3" max="12"><output id="glare_contrast-out"></output></div>
        </div>
        <div class="row">
          <div class="row-label"><span data-t="strength"></span></div>
          <div class="row-ctl slider"><input type="range" id="glare_strength" min="20" max="90"><output id="glare_strength-out"></output></div>
        </div>
        <div class="row">
          <div class="row-label"><span data-t="margin"></span></div>
          <div class="row-ctl"><div class="seg" id="glare_margin"></div></div>
        </div>
        <div class="row">
          <div class="row-label"><span data-t="fade"></span></div>
          <div class="row-ctl slider"><input type="range" id="glare_fade_ms" min="100" max="1500" step="50"><output id="glare_fade_ms-out"></output></div>
        </div>
      </div>
    </div>
  </section>

  <section class="block">
    <div class="block-head">
      <h2 data-t="tint"></h2>
      <div class="head-ctl">
        <button class="btn subtle" data-reset="tint" type="button" data-t="reset"></button>
        <label class="toggle"><input type="checkbox" id="tint_on" role="switch" data-t-aria="tint"><span class="track"></span></label>
      </div>
    </div>
    <div class="group" id="tint-group">
      <div class="row">
        <div class="row-label"><span data-t="kelvin"></span></div>
        <div class="row-ctl slider"><span class="swatch" id="swatch"></span><input type="range" id="kelvin" step="100"><output id="kelvin-out"></output></div>
      </div>
      <div class="row">
        <div class="row-label"><span data-t="strength"></span></div>
        <div class="row-ctl slider"><input type="range" id="strength" min="0"><output id="strength-out"></output></div>
      </div>
      <div class="row">
        <div class="row-label"><span data-t="night_only"></span><small id="night-hint"></small></div>
        <div class="row-ctl times">
          <input type="time" id="night_start" data-t-aria="from">
          <span class="to" data-t="to"></span>
          <input type="time" id="day_start" data-t-aria="to">
          <label class="toggle"><input type="checkbox" id="tint_night_only" role="switch" data-t-aria="night_only"><span class="track"></span></label>
        </div>
      </div>
    </div>
  </section>

  <section class="block">
    <div class="block-head">
      <h2 data-t="options"></h2>
      <button class="btn subtle" data-reset="options" type="button" data-t="reset"></button>
    </div>
    <div class="group">
      <div class="row">
        <div class="row-label"><span data-t="rate"></span></div>
        <div class="row-ctl"><div class="seg" id="rate"></div></div>
      </div>
      <div class="row">
        <div class="row-label"><span data-t="hotkey"></span><small id="hotkey-hint"></small></div>
        <div class="row-ctl"><label class="toggle"><input type="checkbox" id="hotkey" role="switch"><span class="track"></span></label></div>
      </div>
      <div class="row">
        <div class="row-label"><span data-t="start_paused"></span></div>
        <div class="row-ctl"><label class="toggle"><input type="checkbox" id="start_paused" role="switch"><span class="track"></span></label></div>
      </div>
      <div class="row">
        <div class="row-label"><span data-t="close_to_tray"></span></div>
        <div class="row-ctl"><label class="toggle"><input type="checkbox" id="close_to_tray" role="switch"><span class="track"></span></label></div>
      </div>
      <div class="row">
        <div class="row-label"><span data-t="start_minimized"></span></div>
        <div class="row-ctl"><label class="toggle"><input type="checkbox" id="start_minimized" role="switch"><span class="track"></span></label></div>
      </div>
      <div class="row">
        <div class="row-label"><span>Sprache / Language</span></div>
        <div class="row-ctl"><div class="seg" id="language"></div></div>
      </div>
    </div>
  </section>

  <section class="block">
    <details class="log">
      <summary data-t="log"></summary>
      <pre id="log"></pre>
    </details>
  </section>
</main>

<template id="monitor-tpl">
  <article class="monitor">
    <div class="mon-head">
      <span class="mon-num"></span>
      <div class="mon-name"><span class="mon-title"></span><small class="mon-meta"></small></div>
      <label class="toggle"><input type="checkbox" role="switch"><span class="track"></span></label>
    </div>
    <div class="meter">
      <div class="ramp"></div>
      <div class="needle"></div>
    </div>
    <dl class="readout">
      <div><dt data-t="brightness"></dt><dd class="v-bright"></dd></div>
      <div><dt data-t="dimmed"></dt><dd class="v-dim"></dd></div>
      <div><dt data-t="filter"></dt><dd class="v-tint"></dd></div>
    </dl>
  </article>
</template>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
